name: Disney Attraction Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # S'exécute automatiquement toutes les 5 minutes
  workflow_dispatch:        # Permet de lancer manuellement la vérification

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération des fichiers du dépôt
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installation de la librairie requests
        run: pip install requests

      - name: Exécution du script de vérification
        run: python main.py

      - name: Enregistrement automatique de l'état
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add previous_states.json || true
          git commit -m "Mise à jour état attractions" || exit 0
          git push
          
